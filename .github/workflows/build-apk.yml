name: Build APK Sidicley
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Aceitar licenças e configurar SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p app
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Compilar APK
        run: |
          chmod +x gradlew || true
          ls -la gradle/wrapper/ || true
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-sidicley-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/**/*.apk
